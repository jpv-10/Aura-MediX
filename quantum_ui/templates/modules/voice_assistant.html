<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Assistant — Aura MediX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modules.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>
        /* ═══════════════════════════════════════════════════
           DESIGN TOKENS
        ═══════════════════════════════════════════════════ */
        :root {
            --violet:       #7c6dfa;
            --violet-light: #a89bfc;
            --violet-dark:  #5a4dc4;
            --teal:         #4dd9c0;
            --rose:         #f06292;
            --amber:        #f5a623;

            --bg-deep:      #050810;
            --bg-card:      rgba(9, 13, 28, 0.93);
            --bg-inset:     rgba(4, 7, 16, 0.72);

            --text-bright:  #ecebff;
            --text-mid:     #7b86a8;
            --text-muted:   #404a67;

            --border-soft:  rgba(124, 109, 250, 0.11);
            --border-mid:   rgba(124, 109, 250, 0.22);

            --glow-violet:  rgba(124, 109, 250, 0.32);
            --glow-rose:    rgba(240, 98, 146, 0.32);
            --glow-teal:    rgba(77, 217, 192, 0.28);

            --radius-card:  26px;
            --radius-item:  15px;
            --radius-pill:  999px;

            --font-body:    'Outfit', sans-serif;
            --font-mono:    'DM Mono', monospace;

            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ═══════════════════════════════════════════════════
           RESET & BASE
        ═══════════════════════════════════════════════════ */
        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-bright);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════════════════════════════════════════
           AMBIENT SCENE — Background gradients
        ═══════════════════════════════════════════════════ */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 55% at 50% -8%,  rgba(124,109,250,0.17) 0%, transparent 62%),
                radial-gradient(ellipse 45% 35% at 88%  80%,  rgba(77,217,192,0.09)  0%, transparent 55%),
                radial-gradient(ellipse 38% 28% at 10%  88%,  rgba(240,98,146,0.07)  0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Neural network canvas */
        #bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        /* ═══════════════════════════════════════════════════
           FLOATING PARTICLES  (JS writes to this container)
        ═══════════════════════════════════════════════════ */
        .particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, rgba(124,109,250,0.7), transparent 70%);
            border-radius: 50%;
            animation: particleFloat 15s linear infinite;
        }

        @keyframes particleFloat {
            0%   { transform: translateY(0)      translateX(0);    opacity: 0; }
            8%   { opacity: 0.9; }
            90%  { opacity: 0.3; }
            100% { transform: translateY(-100vh) translateX(70px); opacity: 0; }
        }

        /* ═══════════════════════════════════════════════════
           LAYOUT CONTAINER
        ═══════════════════════════════════════════════════ */
        .voice-assistant-container {
            position: relative;
            z-index: 2;
            max-width: 740px;
            margin: 0 auto;
            padding: clamp(28px, 6vh, 72px) clamp(16px, 4vw, 36px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 32px;
        }

        /* ═══════════════════════════════════════════════════
           HEADER
        ═══════════════════════════════════════════════════ */
        .va-header {
            text-align: center;
            animation: fadeInDown 0.9s var(--transition-smooth) both;
        }

        /* Live pill badge */
        .va-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(124,109,250,0.09);
            border: 1px solid rgba(124,109,250,0.22);
            border-radius: var(--radius-pill);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.10em;
            text-transform: uppercase;
            color: var(--violet-light);
            margin-bottom: 22px;
        }

        .va-pill-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 7px 2px var(--glow-teal);
            animation: pillDotPulse 2.2s ease-in-out infinite;
        }

        @keyframes pillDotPulse {
            0%, 100% { transform: scale(1);    opacity: 1;   }
            50%       { transform: scale(0.65); opacity: 0.4; }
        }

        .va-header h1 {
            font-family: var(--font-body);
            font-size: clamp(24px, 4.5vw, 38px);
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.12;
            background: linear-gradient(135deg, #ffffff 15%, var(--violet-light) 55%, var(--teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .va-header p {
            font-size: 15px;
            color: var(--text-mid);
            font-weight: 400;
            letter-spacing: 0.01em;
            margin-bottom: 20px;
        }

        /* Feature chips row */
        .va-features {
            display: flex;
            justify-content: center;
            gap: 9px;
            flex-wrap: wrap;
        }

        .va-feature-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 13px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.065);
            border-radius: var(--radius-pill);
            font-size: 12px;
            color: var(--text-mid);
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* ═══════════════════════════════════════════════════
           VOICE INTERFACE CARD
        ═══════════════════════════════════════════════════ */
        .voice-interface {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(36px) saturate(1.5);
            -webkit-backdrop-filter: blur(36px) saturate(1.5);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-card);
            padding: clamp(28px, 5vw, 54px) clamp(20px, 5vw, 50px);
            text-align: center;
            animation: fadeInUp 0.9s var(--transition-smooth) 0.18s both;
            overflow: hidden;
        }

        /* Top glow line */
        .voice-interface::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 55%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124,109,250,0.55), rgba(77,217,192,0.35), transparent);
        }

        /* Corner accent marks */
        .voice-interface::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            width: 120px; height: 120px;
            background: radial-gradient(circle at 100% 100%, rgba(77,217,192,0.06), transparent 70%);
            border-radius: 0 0 var(--radius-card) 0;
        }

        /* ═══════════════════════════════════════════════════
           MIC STAGE
        ═══════════════════════════════════════════════════ */
        .mic-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        /* ── Mic Wrapper ── */
        .mic-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Orbiting element — spins around the button */
        .mic-orbit-track {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            animation: orbitSpin 9s linear infinite;
            pointer-events: none;
        }

        .mic-orbit-track-2 {
            animation-duration: 14s;
            animation-direction: reverse;
        }

        .mic-orbit-dot {
            position: absolute;
            border-radius: 50%;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .mic-orbit-track .mic-orbit-dot {
            width: 7px; height: 7px;
            background: var(--violet);
            box-shadow: 0 0 14px 3px var(--glow-violet);
        }

        .mic-orbit-track-2 .mic-orbit-dot {
            width: 5px; height: 5px;
            background: var(--teal);
            box-shadow: 0 0 11px 2px var(--glow-teal);
            top: auto;
            bottom: 14px;
            left: auto;
            right: 8px;
            transform: none;
        }

        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Dashed radar ring */
        .radar-ring {
            position: absolute;
            width: 182px; height: 182px;
            border-radius: 50%;
            border: 1px dashed rgba(124,109,250,0.14);
            animation: radarRotate 18s linear infinite;
            pointer-events: none;
        }

        .radar-ring::after {
            content: '';
            position: absolute;
            top: -3px; left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 6px;
            background: radial-gradient(circle, var(--violet), transparent 80%);
            border-radius: 50%;
            box-shadow: 0 0 8px 3px var(--glow-violet);
        }

        @keyframes radarRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Expanding pulse rings  — JS adds/removes .recording on micButton */
        .pulse-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 1.5px solid rgba(124,109,250,0.18);
            top: 0; left: 0;
            animation: ringExpand 2.8s var(--transition-smooth) infinite;
            pointer-events: none;
        }

        .pulse-ring:nth-child(4) { animation-delay: 0.85s; }
        .pulse-ring:nth-child(5) { animation-delay: 1.7s;  }

        @keyframes ringExpand {
            0%   { transform: scale(0.78); opacity: 0.75; }
            100% { transform: scale(1.80); opacity: 0; }
        }

        /* Recording state — rings turn rose */
        .mic-wrapper:has(.mic-button.recording) .pulse-ring {
            border-color: rgba(240,98,146,0.22);
            animation-duration: 1.7s;
        }

        /* ── Mic Button ── */
        .mic-button {
            position: relative;
            z-index: 10;
            width: 124px;
            height: 124px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(148deg, #9b8dfd 0%, #6a59e8 45%, #7c6dfa 100%);
            box-shadow:
                inset 0 1px 0  rgba(255,255,255,0.18),
                inset 0 -2px 4px rgba(0,0,0,0.25),
                0 4px 8px   rgba(0,0,0,0.45),
                0 10px 28px var(--glow-violet),
                0 22px 52px rgba(124,109,250,0.18);
            transition:
                transform  0.32s var(--transition-bounce),
                box-shadow 0.32s ease;
            animation: micAppear 0.75s var(--transition-smooth) 0.35s both;
        }

        /* JS sets textContent on this — keep it, hide visually */
        .mic-button #micIcon { display: none; }

        /* SVG icon wrappers */
        .mic-svg {
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }

        .mic-icon-stop { display: none; }

        /* Show stop icon when recording class is present */
        .mic-button.recording .mic-icon-normal { display: none; }
        .mic-button.recording .mic-icon-stop   { display: flex; }

        .mic-button:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow:
                inset 0 1px 0  rgba(255,255,255,0.22),
                inset 0 -2px 4px rgba(0,0,0,0.25),
                0 6px 12px  rgba(0,0,0,0.4),
                0 14px 38px rgba(124,109,250,0.55),
                0 32px 64px rgba(124,109,250,0.22);
        }

        .mic-button:active {
            transform: scale(0.94);
            transition-duration: 0.1s;
        }

        .mic-button.recording {
            background: linear-gradient(148deg, #f48fb1 0%, #dc3d74 45%, #f06292 100%);
            box-shadow:
                inset 0 1px 0  rgba(255,255,255,0.18),
                inset 0 -2px 4px rgba(0,0,0,0.25),
                0 4px 8px   rgba(0,0,0,0.45),
                0 10px 28px var(--glow-rose),
                0 22px 52px rgba(240,98,146,0.18);
            animation: recordingBreathe 2s ease-in-out infinite;
        }

        @keyframes recordingBreathe {
            0%, 100% {
                box-shadow:
                    inset 0 1px 0  rgba(255,255,255,0.18),
                    inset 0 -2px 4px rgba(0,0,0,0.25),
                    0 4px 8px   rgba(0,0,0,0.45),
                    0 10px 28px rgba(240,98,146,0.45),
                    0 22px 52px rgba(240,98,146,0.18);
                transform: scale(1);
            }
            50% {
                box-shadow:
                    inset 0 1px 0  rgba(255,255,255,0.22),
                    inset 0 -2px 4px rgba(0,0,0,0.25),
                    0 6px 14px  rgba(0,0,0,0.4),
                    0 16px 44px rgba(240,98,146,0.65),
                    0 36px 72px rgba(240,98,146,0.28);
                transform: scale(1.035);
            }
        }

        @keyframes micAppear {
            from { opacity: 0; transform: scale(0.72); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* Tap hint */
        .mic-tap-hint {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            transition: color 0.35s ease, opacity 0.35s ease;
            user-select: none;
        }

        /* ═══════════════════════════════════════════════════
           WAVEFORM VISUALIZER
        ═══════════════════════════════════════════════════ */
        .waveform-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3.5px;
            height: 60px;
            margin-bottom: 4px;
            padding: 0 8px;
        }

        .waveform-container.hidden { display: none; }

        .waveform-bar {
            flex-shrink: 0;
            width: 3px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--violet-light) 0%, var(--violet-dark) 100%);
            height: var(--h, 20px);
            transform-origin: center;
            animation: waveRise var(--dur, 0.65s) ease-in-out infinite var(--delay, 0s);
            opacity: 0.85;
        }

        /* Alternate teal tint for center bars */
        .waveform-bar:nth-child(n+6):nth-child(-n+10) {
            background: linear-gradient(180deg, #7de8dd 0%, var(--teal) 100%);
        }

        @keyframes waveRise {
            0%, 100% { transform: scaleY(0.22); opacity: 0.35; }
            50%       { transform: scaleY(1);    opacity: 1;    }
        }

        /* ═══════════════════════════════════════════════════
           STATUS BADGE
        ═══════════════════════════════════════════════════ */
        .status-section { margin: 10px 0 18px; }

        .status-badge {
            --badge-fg:   var(--violet-light);
            --badge-bg:   rgba(124,109,250,0.08);
            --badge-bdr:  rgba(124,109,250,0.18);
            --dot-color:  var(--violet);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-bdr);
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 500;
            color: var(--badge-fg);
            transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
        }

        .status-badge[data-state="listening"] {
            --badge-fg:  var(--teal);
            --badge-bg:  rgba(77,217,192,0.08);
            --badge-bdr: rgba(77,217,192,0.22);
            --dot-color: var(--teal);
        }

        .status-badge[data-state="processing"] {
            --badge-fg:  var(--amber);
            --badge-bg:  rgba(245,166,35,0.08);
            --badge-bdr: rgba(245,166,35,0.22);
            --dot-color: var(--amber);
        }

        .status-badge[data-state="error"] {
            --badge-fg:  var(--rose);
            --badge-bg:  rgba(240,98,146,0.08);
            --badge-bdr: rgba(240,98,146,0.22);
            --dot-color: var(--rose);
        }

        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--dot-color);
            box-shadow: 0 0 7px 2px var(--dot-color);
            animation: dotBlink 2s ease-in-out infinite;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.45; transform: scale(0.7); }
        }

        /* ═══════════════════════════════════════════════════
           AI THINKING INDICATOR
        ═══════════════════════════════════════════════════ */
        .thinking-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 0 4px;
            animation: fadeIn 0.3s ease-out;
        }

        .thinking-label {
            font-family: var(--font-mono);
            font-size: 12px;
            font-style: italic;
            color: var(--text-muted);
            letter-spacing: 0.02em;
        }

        .thinking-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .thinking-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            animation: dotBounce 1.25s ease-in-out infinite;
        }

        .thinking-dots span:nth-child(1) { background: var(--violet);       animation-delay: 0s; }
        .thinking-dots span:nth-child(2) { background: var(--violet-light); animation-delay: 0.18s; }
        .thinking-dots span:nth-child(3) { background: var(--teal);         animation-delay: 0.36s; }

        @keyframes dotBounce {
            0%, 100% { transform: translateY(0);  opacity: 0.35; }
            50%       { transform: translateY(-7px); opacity: 1; }
        }

        /* ═══════════════════════════════════════════════════
           TRANSCRIPT AREA
        ═══════════════════════════════════════════════════ */
        .transcript-area {
            background: var(--bg-inset);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-item);
            padding: 18px 20px 18px 20px;
            margin-top: 6px;
            min-height: 82px;
            max-height: 165px;
            overflow-y: auto;
            text-align: left;
            transition: border-color 0.3s ease;
        }

        .transcript-area:hover { border-color: var(--border-mid); }

        .area-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .area-icon-badge {
            width: 22px; height: 22px;
            border-radius: 7px;
            background: rgba(124,109,250,0.13);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .transcript-label,
        .ai-response-label {
            font-size: 10.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.11em;
            font-weight: 600;
        }

        .transcript-text {
            font-family: var(--font-mono);
            font-size: 13.5px;
            color: var(--text-bright);
            line-height: 1.75;
            word-break: break-word;
        }

        /* Cursor blink while typing */
        .transcript-text.typing::after {
            content: '▌';
            color: var(--violet);
            margin-left: 1px;
            animation: cursorBlink 0.75s step-end infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* ═══════════════════════════════════════════════════
           AI RESPONSE PANEL
        ═══════════════════════════════════════════════════ */
        .ai-response {
            background: linear-gradient(135deg,
                rgba(124,109,250,0.07) 0%,
                rgba(77,217,192,0.04)  100%);
            border: 1px solid rgba(124,109,250,0.15);
            border-radius: var(--radius-item);
            padding: 18px 20px;
            margin-top: 13px;
            text-align: left;
            animation: slideUp 0.55s var(--transition-smooth) both;
        }

        /* Animated AI orb */
        .ai-orb {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 32%, var(--violet-light), var(--violet-dark) 80%);
            box-shadow: 0 0 12px 3px var(--glow-violet);
            animation: orbBreathe 3.2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes orbBreathe {
            0%, 100% { box-shadow: 0 0 10px 2px var(--glow-violet); transform: scale(1);    }
            50%       { box-shadow: 0 0 20px 5px var(--glow-violet); transform: scale(1.12); }
        }

        .ai-response-text {
            font-family: var(--font-mono);
            font-size: 13.5px;
            color: var(--violet-light);
            line-height: 1.8;
        }

        /* ═══════════════════════════════════════════════════
           CONTROL BUTTONS
        ═══════════════════════════════════════════════════ */
        .control-buttons {
            display: flex;
            gap: 11px;
            justify-content: center;
            margin-top: 26px;
            flex-wrap: wrap;
        }

        .btn-control {
            padding: 9px 28px;
            border-radius: 11px;
            border: 1px solid rgba(124,109,250,0.24);
            background: rgba(124,109,250,0.07);
            color: var(--violet-light);
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.025em;
            cursor: pointer;
            transition:
                transform  0.28s var(--transition-bounce),
                box-shadow 0.28s ease,
                background 0.22s ease,
                border-color 0.22s ease;
        }

        .btn-control:hover {
            background: rgba(124,109,250,0.14);
            border-color: rgba(124,109,250,0.45);
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(124,109,250,0.15);
        }

        .btn-control:active {
            transform: translateY(0) scale(0.97);
            transition-duration: 0.08s;
        }

        .btn-clear {
            background: rgba(240,98,146,0.07);
            border-color: rgba(240,98,146,0.22);
            color: #f8a9c2;
        }

        .btn-clear:hover {
            background: rgba(240,98,146,0.13);
            border-color: rgba(240,98,146,0.44);
            box-shadow: 0 6px 22px rgba(240,98,146,0.12);
        }

        /* ═══════════════════════════════════════════════════
           SCROLLBAR
        ═══════════════════════════════════════════════════ */
        .transcript-area::-webkit-scrollbar { width: 4px; }
        .transcript-area::-webkit-scrollbar-track { background: transparent; }
        .transcript-area::-webkit-scrollbar-thumb {
            background: rgba(124,109,250,0.22);
            border-radius: 4px;
        }

        /* ═══════════════════════════════════════════════════
           KEYFRAME LIBRARY
        ═══════════════════════════════════════════════════ */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-26px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ═══════════════════════════════════════════════════
           RESPONSIVE
        ═══════════════════════════════════════════════════ */
        @media (max-width: 640px) {
            .voice-interface { border-radius: 20px; }
            .mic-wrapper  { width: 178px; height: 178px; }
            .mic-button   { width: 104px; height: 104px; }
            .radar-ring   { width: 152px; height: 152px; }
            .va-features  { display: none; }
        }

        @media (max-width: 420px) {

            .mic-button .mic-icon-normal svg { width: 36px; height: 36px; }
            .radar-ring   { width: 133px; height: 133px; }
            .control-buttons { flex-direction: column; }
            .btn-control  { width: 100%; }
        }
    </style>

    <!-- Neural background canvas — standalone, no interaction with VoiceAssistant -->
    <script>
    (function () {
        'use strict';
        const canvas = document.getElementById('bgCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [];

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function initNodes() {
            nodes = [];
            const count = Math.min(50, Math.floor(W * H / 24000));
            for (let i = 0; i < count; i++) {
                nodes.push({
                    x:  Math.random() * W,
                    y:  Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.22,
                    vy: (Math.random() - 0.5) * 0.22,
                    r:  Math.random() * 1.4 + 0.4
                });
            }
        }
        initNodes();

        function draw() {
            ctx.clearRect(0, 0, W, H);

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx   = nodes[i].x - nodes[j].x;
                    const dy   = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 185) {
                        const alpha = (1 - dist / 185) * 0.13;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(124,109,250,${alpha})`;
                        ctx.lineWidth   = 0.6;
                        ctx.stroke();
                    }
                }
            }

            for (const n of nodes) {
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(124,109,250,0.38)';
                ctx.fill();
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;
            }

            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>
